<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; padding: 18px; font-family: system-ui, sans-serif; margin: 0; color: #333; }
  h2 { font-size: 15px; margin: 0 0 12px; color: #00aeec; }
  .count-line { font-size: 13px; color: #666; margin: 0 0 16px; }
  .count { color: #00aeec; font-weight: 700; font-size: 22px; vertical-align: middle; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 8px; font-family: inherit; }
  .primary { background: #00aeec; color: #fff; }
  .primary:hover { background: #0098d1; }
</style>
</head>
<body>
<h2>B站评论收藏夹</h2>
<p class="count-line">已收藏 <span class="count" id="count">0</span> 条</p>
<button class="primary" id="openManageBtn">📋 打开管理页面</button>
<script src="popup.js"></script>
</body>
</html>
